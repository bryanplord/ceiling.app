# Render blueprint: https://render.com/docs/blueprint-spec
# Free tier: the app sleeps after 15 idle minutes (about a minute to wake) and has no
# permanent disk, so all data lives in a free Turso database (turso.tech).
services:
  - type: web
    name: ceiling
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn rx.web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: RX_TZ
        value: America/Los_Angeles
      - key: RX_BASE_URL
        value: https://ceiling.app
      - key: INTERVALS_ATHLETE_ID
        value: "0"
      - key: RX_SECRET
        generateValue: true  # Render creates a random secret that signs sessions
      - key: TURSO_DATABASE_URL
        sync: false          # libsql://… from the Turso dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false          # database token from the Turso dashboard; never in git
      - key: INTERVALS_API_KEY
        sync: false          # intervals.icu → Settings → Developer Settings; never in git
      - key: RX_USERS
        sync: false          # accounts: email=salt$hash pairs, comma-separated; never in git
