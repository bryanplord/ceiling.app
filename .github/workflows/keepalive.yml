# Render's free plan puts the server to sleep after 15 idle minutes, and waking
# it takes ~50 seconds. A ping every 10 minutes keeps it awake.
name: keep-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 120 https://ceiling-vkxk.onrender.com/healthz > /dev/null
