{% extends "base.html" %}
{% block nav %}{% endblock %}
{% block body %}
{% if sent %}
<h1>Check your email.</h1>
<p class="big">If that address is on the list, a sign-in link is on its way. It works for 15 minutes.</p>
{% else %}
<h1>Ceiling.</h1>
<form method="post" action="/login">
  <input type="email" name="email" required autocomplete="email" placeholder="you@example.com"
         style="width:100%;font:inherit;font-size:22px;padding:16px 18px;border:1px solid var(--line);
                border-radius:14px;background:transparent;color:var(--fg);">
  <button type="submit"
          style="margin-top:16px;width:100%;font:inherit;font-size:18px;font-weight:600;padding:16px;
                 border:0;border-radius:14px;background:var(--fg);color:var(--bg);cursor:pointer;">
    Email me a sign-in link
  </button>
</form>
{% endif %}
{% endblock %}
