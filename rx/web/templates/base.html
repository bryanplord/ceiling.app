<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ceiling</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
  :root {
    --snow:#f4f6f5; --ink:#14181a; --lichen:#667174; --frost:#e3e8e7; --frost2:#d6dddc; --rule:#cfd6d5;
    --ceiling:#ff4a1c; --good:#23784f; --warn:#a96a10; --bad:#c2321c;
    --easy:#9db8ab; --middle:#d0b37a; --hard:#14181a;
    --z1:#5b9bd5; --z2:#2fae6b; --z3:#e6c13d; --z4:#f2903a; --z5:#d9433b;
    --face:"Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --snow:#0d1114; --ink:#eceff0; --lichen:#8d989b; --frost:#161d21; --frost2:#1d252a; --rule:#273036;
      --ceiling:#ff5a2e; --good:#43c286; --warn:#e9ad45; --bad:#ff6a52;
      --easy:#4d6d5f; --middle:#8f7746; --hard:#eceff0;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--snow); color:var(--ink);
         font:400 17px/1.5 var(--face); font-stretch:100%;
         -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  :focus-visible { outline:2px solid var(--ceiling); outline-offset:3px; border-radius:3px; }
  .cond { font-stretch:72%; }
  .num { font-variant-numeric:tabular-nums; }
  .muted { color:var(--lichen); }

  /* top bar */
  .bar { max-width:1200px; margin:0 auto; padding:22px 32px; display:flex; align-items:center; gap:28px; }
  .bar .wordmark { height:30px; width:auto; color:var(--ink); flex:none; }
  .bar nav { display:flex; gap:24px; overflow-x:auto; font-size:15px; margin-left:auto; scrollbar-width:none; }
  .bar nav a { text-decoration:none; color:var(--lichen); white-space:nowrap; padding:4px 0; }
  .bar nav a.on { color:var(--ink); box-shadow:inset 0 -2px 0 var(--ceiling); }

  main { max-width:1200px; margin:0 auto; padding:24px 32px 120px; }
  main.narrow { max-width:780px; }
  h1 { font-weight:850; font-stretch:68%; letter-spacing:-0.01em; line-height:.9; margin:0; }
  h2 { font-size:15px; font-weight:600; color:var(--lichen); margin:0 0 18px; letter-spacing:.01em; }
  .big { font-size:clamp(24px, 4.6vw, 30px); line-height:1.25; font-weight:600; letter-spacing:-0.01em; margin:0; }
  ul, ol { padding-left:20px; margin:8px 0 0; } li { margin:6px 0; }

  /* secondary pages */
  .row { display:flex; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid var(--rule); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
  .green{background:var(--good)} .amber{background:var(--warn)} .red{background:var(--bad)} .unknown{background:var(--lichen)}
  main.narrow h1 { font-size:clamp(56px, 11vw, 96px); margin-bottom:28px; }

  @media (max-width: 760px) {
    .bar { padding:16px 20px; gap:16px; flex-wrap:wrap; }
    .bar .wordmark { height:24px; }
    .bar nav { margin-left:0; width:100%; gap:20px; }
    main { padding:12px 20px 80px; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block nav %}
<header class="bar">
  <a href="/" aria-label="Today">{% include "_wordmark.html" %}</a>
  <nav>
    <a href="/" class="{{ 'on' if active=='today' }}">Today</a>
    <a href="/trends" class="{{ 'on' if active=='trends' }}">Trends</a>
    <a href="/zones" class="{{ 'on' if active=='zones' }}">Zones</a>
    <a href="/yesterday" class="{{ 'on' if active=='yesterday' }}">Yesterday</a>
    <a href="/recovery" class="{{ 'on' if active=='recovery' }}">Recovery</a>
    <a href="/progress" class="{{ 'on' if active=='progress' }}">Progress</a>
    <a href="/profile" class="{{ 'on' if active=='profile' }}">Profile</a>
    <a href="/logout">Sign out</a>
  </nav>
</header>
{% endblock %}
<main class="{{ 'narrow' if active not in ('today', 'login') }}">{% block body %}{% endblock %}</main>
</body>
</html>
