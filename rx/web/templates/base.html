<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ceiling</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
  :root {
    --paper:#ffffff; --ink:#0a0a0a; --graphite:#6e6e73; --mist:#f5f5f7; --line:#e5e5ea;
    --ceiling:#ff4a1c; --go:#1f8a4c; --caution:#a86400; --stop:#c4281f; --unknown:#aeaeb2;
    --easy:#9fb7a8; --middle:#c9b48a; --hard:#0a0a0a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#000000; --ink:#f5f5f7; --graphite:#98989d; --mist:#1c1c1e; --line:#2c2c2e;
      --ceiling:#ff5a2e; --go:#30d158; --caution:#ffcc33; --stop:#ff453a;
      --easy:#4f6b5a; --middle:#8a7448; --hard:#f5f5f7;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font:17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
         -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  :focus-visible { outline:2px solid var(--ink); outline-offset:2px; border-radius:4px; }
  nav { display:flex; align-items:center; gap:22px; padding:18px 24px; font-size:15px; overflow-x:auto;
        max-width:1120px; margin:0 auto; }
  nav a { color:var(--graphite); text-decoration:none; white-space:nowrap; }
  nav a.on { color:var(--ink); font-weight:600; }
  nav .mark { width:26px; height:26px; margin-right:6px; flex:none; }
  nav .out { margin-left:auto; }
  main { max-width:1120px; margin:0 auto; padding:40px 24px 120px; }
  main.narrow { max-width:760px; }
  h1 { font-size:clamp(52px, 10vw, 112px); line-height:.98; letter-spacing:-0.04em;
       font-weight:800; margin:0 0 28px; text-wrap:balance; }
  h2 { font-size:20px; letter-spacing:-0.01em; font-weight:700; margin:0 0 20px; }
  h2 span { color:var(--graphite); font-weight:400; margin-left:6px; }
  .big { font-size:clamp(24px, 5vw, 32px); line-height:1.25; font-weight:600; letter-spacing:-0.015em;
         text-wrap:pretty; margin:0; }
  .muted { color:var(--graphite); }
  .num { font-variant-numeric:tabular-nums; }
  ul { padding-left:20px; margin:8px 0 0; } li { margin:6px 0; }

  /* older pages */
  .row { display:flex; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
  .green{background:var(--go)} .amber{background:var(--caution)} .red{background:var(--stop)} .unknown{background:var(--unknown)}

  /* today: hero */
  .hero { max-width:820px; padding-bottom:56px; }
  .date { color:var(--graphite); margin:0 0 12px; }
  .move { font-size:clamp(24px, 3.4vw, 34px); line-height:1.25; font-weight:600; letter-spacing:-0.015em;
          margin:0 0 8px; text-wrap:pretty; }
  .steps { margin:12px 0 0; padding-left:22px; font-size:19px; }
  .dont { color:var(--graphite); font-size:19px; margin:4px 0 0; }
  .ceil { display:block; margin:28px 0 8px; max-width:820px; overflow:visible; }
  .ceil .track { fill:var(--mist); }
  .ceil .target { fill:var(--ink); opacity:.88; }
  .ceil .limit { fill:var(--ceiling); }
  .ceil .avg { fill:var(--paper); }
  .ceil text { font-size:26px; fill:var(--ink); font-weight:600; }
  .ceil .ceilnum { fill:var(--ceiling); font-weight:800; }
  .ceil .muted { fill:var(--graphite); font-weight:400; }

  /* activity vs recovery */
  .split { display:grid; grid-template-columns:1fr 1fr; gap:64px; padding:48px 0;
           border-top:1px solid var(--line); }
  .metric { padding:18px 0 20px; border-bottom:1px solid var(--line); }
  .metric:last-child { border-bottom:0; }
  .mhead { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .mname { font-weight:600; }
  .state { color:var(--graphite); font-weight:600; }
  .good { color:var(--go); } .ok { color:var(--caution); } .bad { color:var(--stop); } .none { color:var(--graphite); }
  .mrow { display:flex; align-items:center; gap:20px; margin-top:6px; }
  .mval { font-size:40px; font-weight:700; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;
          min-width:120px; white-space:nowrap; }
  .mval.big { font-size:34px; white-space:normal; }
  .chart { flex:1; min-width:0; }
  .mdetail { color:var(--graphite); margin:6px 0 0; font-size:15px; line-height:1.45; }
  .spark .line { fill:none; stroke:var(--ink); stroke-width:2; vector-effect:non-scaling-stroke;
                 stroke-linejoin:round; stroke-linecap:round; }
  .spark .end { fill:var(--ink); }
  .spark .band { fill:var(--mist); }
  .spark .bar { fill:var(--ink); opacity:.8; }
  .mix { display:flex; height:14px; border-radius:7px; overflow:hidden; margin-top:12px; gap:2px; }
  .mix .easy { background:var(--easy); } .mix .middle { background:var(--middle); } .mix .hard { background:var(--hard); }
  .mixkey { display:flex; gap:18px; flex-wrap:wrap; }
  .k { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px; }
  .k.easy { background:var(--easy); } .k.middle { background:var(--middle); } .k.hard { background:var(--hard); }
  .recent { margin-top:8px; font-size:15px; }
  .recent .row { padding:10px 0; }
  .recent .row span:first-child { color:var(--graphite); min-width:84px; }
  .recent .row span:nth-child(2) { flex:1; }

  /* the call */
  .priority { padding:56px 0; border-top:1px solid var(--line); max-width:820px; }
  .pcall { font-size:clamp(34px, 5.4vw, 56px); line-height:1.05; letter-spacing:-0.03em; font-weight:800;
           margin:0 0 16px; text-wrap:balance; }
  .pwhy { font-size:19px; color:var(--graphite); margin:0 0 12px; text-wrap:pretty; }
  .priority ul { font-size:19px; }

  .detail { padding-top:48px; border-top:1px solid var(--line); max-width:820px; }
  .detail dl { display:grid; grid-template-columns:160px 1fr; gap:14px 32px; margin:0; }
  .detail dt { color:var(--graphite); font-weight:600; }
  .detail dd { margin:0; } .detail dd p { margin:0 0 6px; }
  .note { color:var(--graphite); font-size:15px; margin-top:24px; }
  .empty { padding:48px 0; border-top:1px solid var(--line); }

  @media (max-width: 760px) {
    main { padding:24px 20px 80px; }
    nav { padding:14px 20px; gap:18px; }
    .split { grid-template-columns:1fr; gap:40px; padding:36px 0; }
    .mval { font-size:34px; min-width:96px; }
    .detail dl { grid-template-columns:1fr; gap:4px; }
    .detail dd { margin-bottom:14px; }
    .ceil text { font-size:34px; }
  }
</style>
</head>
<body>
{% block nav %}
<nav>
  <img class="mark" src="/static/favicon.svg" alt="Ceiling">
  <a href="/" class="{{ 'on' if active=='today' }}">Today</a>
  <a href="/yesterday" class="{{ 'on' if active=='yesterday' }}">Yesterday</a>
  <a href="/recovery" class="{{ 'on' if active=='recovery' }}">Recovery</a>
  <a href="/progress" class="{{ 'on' if active=='progress' }}">Progress</a>
  <a href="/profile" class="{{ 'on' if active=='profile' }}">Profile</a>
  <a href="/logout" class="out">Sign out</a>
</nav>
{% endblock %}
<main class="{{ 'narrow' if active != 'today' }}">{% block body %}{% endblock %}</main>
</body>
</html>
