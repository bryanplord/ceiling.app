<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Ceiling</title>
<meta name="description" content="Your daily workout prescription, based on your own heart rate, HRV, sleep and training load.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ceiling">
<meta property="og:title" content="Ceiling. This is how you train.">
<meta property="og:description" content="Your daily workout prescription, based on your own heart rate, HRV, sleep and training load.">
<meta property="og:url" content="https://www.ceiling.app/">
<meta property="og:image" content="https://www.ceiling.app/static/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.ceiling.app/static/og.png">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link rel="icon" href="/static/favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="/static/icon-32.png?v=3" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=3">
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ceiling">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Ceiling">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
  :root {
    --snow:#ffffff; --ink:#0a0a0a; --lichen:#6b6b6f; --frost:#f2f2f3; --frost2:#e6e6e8; --rule:#e2e2e5;
    --ceiling:#ff3b30; --good:#23784f; --warn:#a96a10; --bad:#c2321c;
    --easy:#9db8ab; --middle:#d0b37a; --hard:#0a0a0a;
    --z1:#5b9bd5; --z2:#2fae6b; --z3:#e6c13d; --z4:#f2903a; --z5:#d9433b;
    /* Brand spectrum: your heart, resting to max. The top of it is the Ceiling red. */
    --s-rec:#8e7cc3; --s-end:#4a7fd4; --s-aer:#2e9e6a; --s-tem:#e0b030; --s-thr:#ee7a30; --s-max:#ff3b30;
    --spectrum:linear-gradient(90deg, var(--s-rec) 0 16.66%, var(--s-end) 0 33.33%, var(--s-aer) 0 50%, var(--s-tem) 0 66.66%, var(--s-thr) 0 83.33%, var(--s-max) 0);
    --face:"Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    /* Motion, after apple.com: one easing, short durations, nothing bounces. */
    --ease:cubic-bezier(.28, .11, .32, 1);      /* apple.com's standard curve */
    --ease-out:cubic-bezier(.16, 1, .3, 1);     /* things arriving */
    --t-fast:.2s; --t:.4s; --t-slow:.7s;
  }
  /* Page to page: the bar stays put, the page cross-fades (Safari 18.2+, Chrome 126+). */
  @view-transition { navigation:auto; }
  ::view-transition-old(root) { animation:var(--t-fast) var(--ease) both vt-out; }
  ::view-transition-new(root) { animation:var(--t) var(--ease-out) both vt-in; }
  @keyframes vt-out { to { opacity:0; } }
  @keyframes vt-in { from { opacity:0; transform:translateY(8px); } }
  .bar { view-transition-name:bar; }
  .spec { view-transition-name:spec; }
  /* First paint: the page settles in once. Pages mark their own pieces with .rise (and --i for order). */
  @keyframes rise { from { opacity:0; transform:translateY(14px); } }
  .rise { animation:rise var(--t-slow) var(--ease-out) both; animation-delay:calc(var(--i, 0) * 70ms); }
  /* Controls answer the finger: colour eases, a press sinks a little. */
  a, button, .pill, summary { transition:color var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease),
                              border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease),
                              opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
  button:active, .pill:active { transform:scale(.97); }
  /* Disclosures open and close smoothly where the browser can animate to auto height. */
  :root { interpolate-size:allow-keywords; }
  details::details-content { height:0; overflow:clip; opacity:0;
                             transition:height var(--t) var(--ease), opacity var(--t) var(--ease), content-visibility var(--t) allow-discrete; }
  details[open]::details-content { height:auto; opacity:1; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after, ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) {
      animation-duration:.01ms !important; animation-delay:0s !important; transition-duration:.01ms !important; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--snow); color:var(--ink);
         font:400 17px/1.5 var(--face); font-stretch:100%;
         -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  :focus-visible { outline:2px solid var(--ceiling); outline-offset:3px; border-radius:3px; }
  .cond { font-stretch:72%; }
  .num { font-variant-numeric:tabular-nums; }
  .muted { color:var(--lichen); }

  /* top bar */
  .bar { max-width:1200px; margin:0 auto; padding:22px 32px; display:flex; align-items:center; gap:28px; }
  .spec { height:4px; background:var(--spectrum); }
  .bleed { margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw); padding-left:calc(50vw - 50%) !important; padding-right:calc(50vw - 50%) !important; }
  .bar .wordmark { font-size:21px; flex:none; }
  .bar nav { display:flex; gap:24px; overflow-x:auto; font-size:15px; margin-left:auto; scrollbar-width:none; }
  .bar nav a { text-decoration:none; color:var(--lichen); white-space:nowrap; padding:4px 0; }
  .bar nav a { box-shadow:inset 0 0 0 var(--ceiling); }
  .bar nav a:hover { color:var(--ink); }
  .bar nav a.on { color:var(--ink); box-shadow:inset 0 -2px 0 var(--ceiling); }

  main { max-width:1200px; margin:0 auto; padding:24px 32px 120px; }
  main.narrow { max-width:780px; }
  /* Brand display: Archivo Expanded 125, semibold, capitals tracked +8%. */
  h1 { font-weight:600; font-stretch:125%; text-transform:uppercase; letter-spacing:.04em; line-height:1; margin:0; }
  .wordmark { font-family:var(--face); font-weight:600; font-stretch:125%; letter-spacing:.08em; color:var(--ink);
              white-space:nowrap; line-height:1; display:inline-block; }
  .wordmark .mark { height:.72em; width:auto; display:inline-block; vertical-align:baseline; margin-right:.3em; }
  .wordmark .wm { margin-right:-.08em; }
  .bar a:has(.wordmark) { text-decoration:none; }
  h2 { font-size:15px; font-weight:600; color:var(--lichen); margin:0 0 18px; letter-spacing:.01em; }
  .big { font-size:clamp(24px, 4.6vw, 30px); line-height:1.25; font-weight:600; letter-spacing:-0.01em; margin:0; }
  ul, ol { padding-left:20px; margin:8px 0 0; } li { margin:6px 0; }

  /* secondary pages */
  .row { display:flex; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid var(--rule); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
  .green{background:var(--good)} .amber{background:var(--warn)} .red{background:var(--bad)} .unknown{background:var(--lichen)}
  main.narrow h1 { font-size:clamp(36px, 7vw, 72px); margin-bottom:28px; }

  @media (max-width: 760px) {
    .bar { padding:16px 20px; gap:16px; flex-wrap:wrap; }
    .bar .wordmark { font-size:18px; }
    .bar nav { margin-left:0; width:100%; gap:20px; }
    main { padding:12px 20px 80px; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="spec" aria-hidden="true"></div>
{% block nav %}
<header class="bar">
  <a href="/" aria-label="Today">{% include "_wordmark.html" %}</a>
  <nav>
    <a href="/" class="{{ 'on' if active=='today' }}">Today</a>
    <a href="/dashboard" class="{{ 'on' if active in ('dashboard', 'progress', 'trends', 'zones', 'you', 'recovery') }}">Dashboard</a>
    <a href="/calendar" class="{{ 'on' if active in ('calendar', 'history') }}">Calendar</a>
    <a href="/workouts" class="{{ 'on' if active=='workouts' }}">Workouts</a>
    <a href="/plan" class="{{ 'on' if active=='plan' }}">Plan</a>
    <a href="/me" class="{{ 'on' if active in ('me', 'profile', 'data', 'yesterday') }}">Profile</a>
  </nav>
</header>
{% endblock %}
<main class="{{ 'narrow' if active not in ('today', 'dashboard', 'login', 'calendar', 'workouts', 'plan') }}">{% block body %}{% endblock %}</main>
</body>
</html>
