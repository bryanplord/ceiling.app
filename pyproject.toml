[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rx"
version = "0.1.0"
description = "Daily training prescription from your own data"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "libsql>=0.1.11",
]

[project.optional-dependencies]
garmin = ["garminconnect>=0.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rx = "rx.cli:main"

[tool.setuptools.packages.find]
include = ["rx*"]

[tool.setuptools.package-data]
rx = ["web/templates/*.html", "web/static/*"]
